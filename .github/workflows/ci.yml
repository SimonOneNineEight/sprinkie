name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract types are up to date
        run: |
          pnpm run generate:api-types
          git diff --exit-code apps/mobile/src/api/types.gen.ts
      - name: Theme is up to date with design tokens
        run: |
          pnpm run generate:theme
          git diff --exit-code apps/mobile/src/theme/theme.gen.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: supabase/setup-cli@v1
        with:
          # Keep in sync with the CLI that generated supabase/config.toml;
          # older CLIs reject its newer config keys.
          version: 2.107.0
      - name: Start local Supabase (db + auth; applies migrations)
        run: supabase start -x edge-runtime,imgproxy,inbucket,meta,realtime,rest,studio
      - name: Export Supabase test env
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          echo "SUPABASE_AUTH_URL=${API_URL}/auth/v1" >> "$GITHUB_ENV"
          echo "SUPABASE_JWKS_URL=${API_URL}/auth/v1/.well-known/jwks.json" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_STORAGE_URL=${API_URL}/storage/v1" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY}" >> "$GITHUB_ENV"
      - name: Generated code is up to date
        working-directory: api
        run: |
          go generate ./...
          git diff --exit-code
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test with 100% coverage gate
        run: api/scripts/coverage.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t sprinkie-api api
