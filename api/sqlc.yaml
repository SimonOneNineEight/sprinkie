version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    # The second entry declares the Supabase CLI's own migration history,
    # which no migration of ours creates, so sqlc can type the health query.
    schema:
      - "../supabase/migrations"
      - "schema/supabase_migrations.sql"
    gen:
      go:
        package: "dbgen"
        out: "gen/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
